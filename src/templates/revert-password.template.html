<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Password Change Confirmation</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                line-height: 1.6;
                margin: 0;
                padding: 0;
                background-color: #f6f9fc;
            }
            .container {
                max-width: 600px;
                margin: 0 auto;
                padding: 20px;
                background-color: #ffffff;
                border-radius: 10px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }
            .header {
                text-align: center;
                padding: 20px 0;
            }
            .logo {
                width: 150px;
                height: auto;
            }
            .content {
                padding: 20px;
                text-align: center;
            }
            .footer {
                text-align: center;
                padding: 20px;
                color: #666;
                font-size: 12px;
                border-top: 1px solid #eee;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <img src="https://placeholder.com/150x50" alt="Company Logo" class="logo">
            </div>
            <div class="content">
                <h1>Password Change Confirmation</h1>
                <p>Your password has been successfully changed.</p>
                <p>If you didn't perform this action, click the button below to revert the change:</p>
                <a href="{{revertLink}}" style="background-color: #4a54f1; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; cursor: pointer;">
                    Revert Password Change
                </a>
                <p class="expiry-notice">This link will expire in 1 hour.</p>
            </div>
            <div class="footer">
                <p>&copy; {{year}} EduFund. All rights reserved.</p>
            </div>
        </div>
    </body>
</html>
